
# -----------------------------
# 1. Worker settings
# -----------------------------
# Keep nginx on a small worker footprint for this local project gateway.
worker_processes  1;

# -----------------------------
# 2. Connection settings
# -----------------------------
# Let nginx keep a normal number of local connections open.
events {
    worker_connections  1024;
}

# -----------------------------
# 3. HTTP routing
# -----------------------------
# Put all reverse-proxy routing inside the standard HTTP block.
http {
    # Map websocket upgrades cleanly because Streamlit uses websocket traffic.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Route all flight API calls to the internal Compose service port.
    upstream flight_api_backend {
        server flight-api:5002;
    }

    # Route all hotel API calls to the internal Compose service port.
    upstream hotel_api_backend {
        server hotel-api:5001;
    }

    # Route all gender API calls to the internal Compose service port.
    upstream gender_api_backend {
        server gender-api:5003;
    }

    # Route the flight Streamlit UI through the internal Compose service port.
    upstream flight_app_backend {
        server flight-streamlit:8501;
    }

    # Route the hotel Streamlit UI through the internal Compose service port.
    upstream hotel_app_backend {
        server hotel-streamlit:8502;
    }

    # Route the gender Streamlit UI through the internal Compose service port.
    upstream gender_app_backend {
        server gender-streamlit:8503;
    }

    # -----------------------------
    # 4. Public gateway server
    # -----------------------------
    # Expose one browser-facing HTTP server for every routed path.
    server {
        # Listen on the default HTTP port inside the container.
        listen 80;

        # Keep the default hostname simple for local browser access.
        server_name localhost;

        # Provide one direct health endpoint for Docker and monitoring scripts.
        location = /health {
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Send the bare root to the main flight app page so the entry point feels intentional.
        location = / {
            return 302 /app/flight/;
        }

        # Normalize the flight app base path so users can omit the trailing slash.
        location = /app/flight {
            return 301 /app/flight/;
        }

        # Proxy the entire flight Streamlit app without stripping its base path.
        location /app/flight/ {
            proxy_pass http://flight_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Normalize the hotel app base path so users can omit the trailing slash.
        location = /app/hotel {
            return 301 /app/hotel/;
        }

        # Proxy the full hotel Streamlit app with websocket-friendly headers.
        location /app/hotel/ {
            proxy_pass http://hotel_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Normalize the gender app base path so users can omit the trailing slash.
        location = /app/gender {
            return 301 /app/gender/;
        }

        # Proxy the full gender Streamlit app with websocket-friendly headers.
        location /app/gender/ {
            proxy_pass http://gender_app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Redirect the short flight API path to the canonical slash form.
        location = /api/flight {
            return 301 /api/flight/;
        }

        # Strip the external prefix before passing flight API requests to Flask.
        location /api/flight/ {
            rewrite ^/api/flight/?(.*)$ /$1 break;
            proxy_pass http://flight_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect the short hotel API path to the canonical slash form.
        location = /api/hotel {
            return 301 /api/hotel/;
        }

        # Strip the external prefix before passing hotel API requests to Flask.
        location /api/hotel/ {
            rewrite ^/api/hotel/?(.*)$ /$1 break;
            proxy_pass http://hotel_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Redirect the short gender API path to the canonical slash form.
        location = /api/gender {
            return 301 /api/gender/;
        }

        # Strip the external prefix before passing gender API requests to Flask.
        location /api/gender/ {
            rewrite ^/api/gender/?(.*)$ /$1 break;
            proxy_pass http://gender_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
