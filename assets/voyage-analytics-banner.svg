<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Voyage Analytics MLOps</title>
  <desc id="desc">A clean banner showing travel analytics, model workflow, APIs, dashboards, and cloud deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="0.55" stop-color="#12355B"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="accent" x1="190" y1="240" x2="1000" y2="110" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#FACC15"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="34" fill="url(#bg)"/>
  <circle cx="1065" cy="66" r="120" fill="#67E8F9" opacity="0.08"/>
  <circle cx="92" cy="302" r="150" fill="#22C55E" opacity="0.08"/>

  <g opacity="0.24">
    <path d="M80 286C220 198 308 224 434 164C576 96 683 102 810 142C916 176 1000 154 1128 82" stroke="white" stroke-width="2" stroke-dasharray="8 12"/>
    <path d="M90 76H1110" stroke="white" stroke-opacity="0.12"/>
    <path d="M90 274H1110" stroke="white" stroke-opacity="0.12"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="70" width="234" height="220" rx="28" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.18"/>
    <circle cx="154" cy="144" r="42" fill="#38BDF8"/>
    <path d="M120 150L154 120L188 150L154 136L120 150Z" fill="white"/>
    <path d="M154 136V202" stroke="white" stroke-width="9" stroke-linecap="round"/>
    <path d="M122 205H186" stroke="white" stroke-width="9" stroke-linecap="round"/>
    <rect x="221" y="135" width="56" height="82" rx="12" fill="#22C55E" fill-opacity="0.92"/>
    <rect x="236" y="166" width="8" height="36" rx="4" fill="white"/>
    <rect x="250" y="149" width="8" height="53" rx="4" fill="white"/>
    <rect x="264" y="178" width="8" height="24" rx="4" fill="white"/>
  </g>

  <path d="M220 244C320 198 438 218 532 176C640 128 742 134 846 166C940 194 1012 174 1090 128" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g fill="white">
    <circle cx="220" cy="244" r="8"/>
    <circle cx="532" cy="176" r="8"/>
    <circle cx="846" cy="166" r="8"/>
    <circle cx="1090" cy="128" r="8"/>
  </g>

  <g transform="translate(366 82)">
    <text x="0" y="0" fill="#BAE6FD" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="4">TRAVEL DATA TO DEPLOYMENT</text>
    <text x="0" y="70" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="800">Voyage Analytics</text>
    <text x="0" y="126" fill="#E0F2FE" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">MLOps Project</text>
    <text x="0" y="184" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="24">EDA | Models | MLflow | APIs | Dashboards | Docker | Kubernetes | Azure</text>
  </g>
